<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sonarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="pingCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0a2a4a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#051326" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Concentric Sonar Rings -->
  <circle cx="50" cy="50" r="46" fill="url(#pingCenter)" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.6"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="#00ff9d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="50" cy="50" r="10" fill="none" stroke="#00e5ff" stroke-width="2"/>
  
  <!-- Crosshairs -->
  <line x1="50" y1="4" x2="50" y2="96" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
  <line x1="4" y1="50" x2="96" y2="50" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>

  <!-- Submarine / Sonar Transducer Array Silhouette -->
  <path d="M 32 50 Q 50 42 68 50 Q 50 58 32 50 Z" fill="#00e5ff" opacity="0.9"/>
  <circle cx="50" cy="50" r="3.5" fill="#ffffff"/>
  
  <!-- Acoustic Wave Sector -->
  <path d="M 50 50 L 76 24 A 36 36 0 0 1 85 50 Z" fill="url(#sonarGlow)" opacity="0.5"/>
</svg>
